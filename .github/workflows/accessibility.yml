name: Accessibility audit
on:
  push:
    branches: [main, ux-improvements]
  pull_request:
permissions:
  contents: read
concurrency:
  group: accessibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify site links and the published audit calculation
        run: python3 scripts/qa.py
      - name: Install pinned audit tools
        working-directory: scripts/accessibility
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        working-directory: scripts/accessibility
        run: npx playwright install --with-deps chromium
      - name: Audit every page at desktop and mobile widths
        run: node scripts/accessibility/audit.cjs
      - name: Test keyboard interactions and fallbacks
        if: always()
        run: node scripts/accessibility/interaction.cjs
      - name: Replay visitor journeys and research interactions
        if: always()
        run: node scripts/accessibility/ux.cjs
      - name: Test academic home, granularity demo and candidacy information
        if: always()
        run: node scripts/accessibility/academic-home.cjs
      - name: Verify document structure and accessible link names
        if: always()
        run: node scripts/accessibility/rgaa-structure.cjs
      - name: Review scientific images and contrast in reading themes
        if: always()
        run: node scripts/accessibility/rgaa-images-colours.cjs
      - name: Verify documents, the tactile demo and pointer controls
        if: always()
        run: node scripts/accessibility/rgaa-documents.cjs
      - name: Verify page reading order, focus and navigation without styles
        if: always()
        run: node scripts/accessibility/rgaa-layout.cjs
      - name: Capture the candidate design
        if: always()
        run: |
          python3 -m http.server 8891 --bind 127.0.0.1 &
          BASE_URL=http://127.0.0.1:8891 PHASE=preview node scripts/accessibility/capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: |
            test-output/
            audit/ux-2026-11-15/preview/
          retention-days: 30

  native-access:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/accessibility
      - run: npx playwright install --with-deps chromium
        working-directory: scripts/accessibility
      - name: Install the native screen reader and desktop test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends orca speech-dispatcher-espeak-ng pulseaudio pulseaudio-utils dbus-x11 xvfb xdotool xauth
      - name: Verify browser zoom and Orca speech on the candidate
        if: always()
        run: |
          xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- bash -eu -c '
            unset NO_AT_BRIDGE
            export XDG_RUNTIME_DIR=$(mktemp -d)
            chmod 700 "$XDG_RUNTIME_DIR"
            dbus-update-activation-environment DISPLAY XAUTHORITY XDG_RUNTIME_DIR
            gsettings set org.gnome.desktop.interface toolkit-accessibility true
            pulseaudio --start --exit-idle-time=-1
            pactl load-module module-null-sink sink_name=review_output
            pactl set-default-sink review_output
            node scripts/accessibility/native-zoom-orca.cjs
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-access-results
          path: test-output/native-access/
          retention-days: 30
