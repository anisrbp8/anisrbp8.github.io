name: Public site UX verification
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/accessibility
      - run: npx playwright install --with-deps chromium
        working-directory: scripts/accessibility
      - name: Wait for the public design version
        if: "!contains(github.event.head_commit.message, '[ux-baseline]')"
        run: |
          # Compare the deployed bytes against this commit, not a fixed CSS/JS
          # version string that may already be present on an older deployment.
          files=(index.html en/index.html recherche.html en/research.html assets/js/site.js)
          for attempt in $(seq 1 30); do
            current=true
            for file in "${files[@]}"; do
              expected=$(sha256sum "$file" | cut -d ' ' -f 1)
              deployed=$(curl --fail --location --silent --show-error --max-time 15 \
                "https://anisrojbi.fr/$file?verify=$GITHUB_SHA" | sha256sum | cut -d ' ' -f 1) || { current=false; break; }
              if [[ "$expected" != "$deployed" ]]; then current=false; break; fi
            done
            if [[ "$current" = true ]]; then exit 0; fi
            sleep 10
          done
          echo "GitHub Pages is not yet serving the HTML and JavaScript from this commit." >&2
          exit 1
      - name: Capture public desktop and mobile pages
        env:
          PHASE: "${{ contains(github.event.head_commit.message, '[ux-baseline]') && 'before' || 'after' }}"
        run: node scripts/accessibility/capture.cjs
      - name: Replay journeys on the published site
        if: "!contains(github.event.head_commit.message, '[ux-baseline]')"
        env:
          BASE_URL: https://anisrojbi.fr
        run: node scripts/accessibility/ux.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-site-ux-evidence
          path: |
            audit/ux-2026-11-15/
            test-output/ux-results.json
          retention-days: 30
