name: Contrôles RGAA des formulaires
on:
  push:
    branches: [audit-rgaa-2026-11-22]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - run: python scripts/accessibility/form_rgaa.py . rgaa-form
        env:
          FORM_AUDIT_OUTPUT: test-output/rgaa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgaa-formulaires
          path: test-output/rgaa/
