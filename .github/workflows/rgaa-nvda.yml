name: RGAA desktop – NVDA and Firefox
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.html'
      - 'assets/**'
      - 'scripts/accessibility/rgaa-nvda.cjs'
      - '.github/workflows/rgaa-nvda.yml'
permissions:
  contents: read
jobs:
  firefox-nvda:
    runs-on: windows-2025
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up the temporary Windows screen-reader session
        run: npx --yes --ignore-scripts=false @guidepup/setup@0.29.3 setup --ci
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/accessibility
      - name: Install the NVDA controller in the test working directory
        run: npm install --no-save --package-lock=false --no-audit --no-fund @guidepup/guidepup@0.40.0
        working-directory: scripts/accessibility
      - name: Install the verified NVDA assets and Firefox
        working-directory: scripts/accessibility
        run: |
          npx --yes --ignore-scripts=false @guidepup/setup@0.29.3 install nvda
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install firefox
      - name: Exercise the site with NVDA and capture its spoken output
        run: node scripts/accessibility/rgaa-nvda.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgaa-nvda-firefox
          path: test-output/rgaa-nvda/
          retention-days: 30
