<text x="246.0" y="399.93" text-anchor="middle" font-size="22" font-weight="normal" fill="#172b3a">
<tspan x="246.0" dy="0">Mesures physiologiques</tspan>
<tspan x="246.0" dy="29.700000000000003">Fréquence cardiaque</tspan>
<tspan x="246.0" dy="29.700000000000003">Pression artérielle</tspan>
