<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title description" xml:lang="fr" lang="fr">
<title id="title">Analyse multimodale de la fatigue</title><desc id="description">Les expressions faciales, mouvements oculaires et autres indices visuels sont analysés par vision par ordinateur. Les données de fréquence cardiaque, pression artérielle et saturation en oxygène apportent des indicateurs complémentaires au modèle d’apprentissage automatique pour étudier la fatigue chez les personnes âgées.</desc>
