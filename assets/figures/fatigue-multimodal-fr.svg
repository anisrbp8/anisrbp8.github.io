<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title description" xml:lang="fr" lang="fr">
<title id="title">Analyse multimodale de la fatigue : approche exploratoire</title><desc id="description">Ce schéma exploratoire propose de réunir des indices visuels et des mesures physiologiques dans un modèle d’apprentissage automatique pour étudier la fatigue. Il envisage l’analyse du visage et des yeux, la fréquence cardiaque, la pression artérielle et la saturation en oxygène ; cette combinaison reste à évaluer.</desc>
