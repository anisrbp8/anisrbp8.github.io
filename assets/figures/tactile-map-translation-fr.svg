<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">Traduction semi-automatique d’une carte géographique en représentation tactile</title><desc id="desc">Un fichier image de carte passe par le traitement d’image, l’OCR et la traduction en braille avec l’assistance d’un spécialiste, pour produire une carte tactile.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#284f54"/></marker></defs><rect width="1100" height="430" rx="18" fill="#faf9f6"/><text x="550" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172b3a">De la carte visuelle à la représentation tactile</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="105" width="210" height="155" rx="14" fill="#eef2ef" stroke="#284f54" stroke-width="3"/><text x="140" y="148" font-size="20" font-weight="700" fill="#172b3a">Carte géographique</text><text x="140" y="183" font-size="17" fill="#172b3a">fichier image</text><text x="140" y="220" font-size="16" fill="#3e505b">source visuelle</text><rect x="305" y="105" width="215" height="155" rx="14" fill="#fff" stroke="#284f54" stroke-width="3"/><text x="412" y="145" font-size="20" font-weight="700" fill="#172b3a">Traitement</text><text x="412" y="172" font-size="20" font-weight="700" fill="#172b3a">d’image</text><text x="412" y="215" font-size="16" fill="#3e505b">analyse de l’image</text><rect x="580" y="105" width="215" height="155" rx="14" fill="#fff" stroke="#284f54" stroke-width="3"/><text x="687" y="145" font-size="20" font-weight="700" fill="#172b3a">OCR et traduction</text><text x="687" y="179" font-size="17" fill="#172b3a">reconnaissance</text><text x="687" y="205" font-size="17" fill="#172b3a">des libellés</text><text x="687" y="235" font-size="16" fill="#3e505b">texte → braille</text><rect x="855" y="105" width="210" height="155" rx="14" fill="#e5eeeb" stroke="#284f54" stroke-width="3"/><text x="960" y="150" font-size="20" font-weight="700" fill="#172b3a">Carte tactile</text><text x="960" y="186" font-size="17" fill="#172b3a">représentation tactile</text><text x="960" y="220" font-size="16" fill="#3e505b">texte en braille</text></g><path d="M248 182 H294" stroke="#284f54" stroke-width="4" marker-end="url(#arrow)"/><path d="M523 182 H569" stroke="#284f54" stroke-width="4" marker-end="url(#arrow)"/><path d="M798 182 H844" stroke="#284f54" stroke-width="4" marker-end="url(#arrow)"/><rect x="125" y="305" width="850" height="74" rx="14" fill="#f5eee8" stroke="#7b452c" stroke-width="2"/><text x="550" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172b3a">Le logiciel semi-automatise la préparation et assiste</text><text x="550" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172b3a">le spécialiste du graphisme tactile.</text></svg>