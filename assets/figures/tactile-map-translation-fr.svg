<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" lang="fr" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">Conversion semi-automatique d’une carte géographique en représentation tactile</title><desc id="desc">Le logiciel assiste un spécialiste dans la production d’une carte tactile à partir d’une image, par traitement d’image, reconnaissance de caractères (OCR) et transcription en braille.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1100" height="430" fill="#ffffff"/><text x="550" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#000000">De la carte visuelle à la représentation tactile</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="105" width="210" height="155" fill="#ffffff" stroke="#000000" stroke-width="4"/><rect x="35" y="105" width="210" height="42" fill="#000000"/><text x="140" y="133" font-size="16" font-weight="700" fill="#ffffff">Carte géographique</text><text x="140" y="183" font-size="18" font-weight="700" fill="#000000">Fichier image</text><text x="140" y="220" font-size="16" fill="#000000">source visuelle</text><rect x="305" y="105" width="215" height="155" fill="#ffffff" stroke="#000000" stroke-width="4"/><rect x="305" y="105" width="215" height="42" fill="#000000"/><text x="412" y="133" font-size="17" font-weight="700" fill="#ffffff">Traitement d’image</text><text x="412" y="183" font-size="18" font-weight="700" fill="#000000">Analyse de l’image</text><text x="412" y="220" font-size="16" fill="#000000">formes et éléments</text><rect x="580" y="105" width="215" height="155" fill="#ffffff" stroke="#000000" stroke-width="4"/><rect x="580" y="105" width="215" height="42" fill="#000000"/><text x="687" y="133" font-size="18" font-weight="700" fill="#ffffff">OCR et braille</text><text x="687" y="181" font-size="17" font-weight="700" fill="#000000">Reconnaissance</text><text x="687" y="207" font-size="17" fill="#000000">des libellés</text><text x="687" y="236" font-size="16" fill="#000000">texte → braille</text><rect x="855" y="105" width="210" height="155" fill="#ffffff" stroke="#000000" stroke-width="4"/><rect x="855" y="105" width="210" height="42" fill="#000000"/><text x="960" y="133" font-size="18" font-weight="700" fill="#ffffff">Carte tactile</text><text x="960" y="183" font-size="18" font-weight="700" fill="#000000">Version tactile</text><text x="960" y="220" font-size="16" fill="#000000">texte en braille</text></g><path d="M248 182 H294" stroke="#000000" stroke-width="5" marker-end="url(#arrow)"/><path d="M523 182 H569" stroke="#000000" stroke-width="5" marker-end="url(#arrow)"/><path d="M798 182 H844" stroke="#000000" stroke-width="5" marker-end="url(#arrow)"/><rect x="125" y="305" width="850" height="74" fill="#000000"/><text x="550" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff">Le logiciel semi-automatise la préparation et assiste le spécialiste</text><text x="550" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#ffffff">du graphisme tactile.</text></svg>