<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">Semi-automated translation of a geographic map into a tactile representation</title><desc id="desc">A map image goes through image processing, OCR and Braille translation with specialist support to produce a tactile map.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#284f54"/></marker></defs><rect width="1100" height="430" rx="18" fill="#faf9f6"/><text x="550" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172b3a">From a visual map to a tactile representation</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="105" width="210" height="155" rx="14" fill="#eef2ef" stroke="#284f54" stroke-width="3"/><text x="140" y="148" font-size="20" font-weight="700" fill="#172b3a">Geographic map</text><text x="140" y="183" font-size="17" fill="#172b3a">image file</text><text x="140" y="220" font-size="16" fill="#3e505b">visual source</text><rect x="305" y="105" width="215" height="155" rx="14" fill="#fff" stroke="#284f54" stroke-width="3"/><text x="412" y="145" font-size="20" font-weight="700" fill="#172b3a">Image</text><text x="412" y="172" font-size="20" font-weight="700" fill="#172b3a">processing</text><text x="412" y="215" font-size="16" fill="#3e505b">image analysis</text><rect x="580" y="105" width="215" height="155" rx="14" fill="#fff" stroke="#284f54" stroke-width="3"/><text x="687" y="145" font-size="20" font-weight="700" fill="#172b3a">OCR and translation</text><text x="687" y="179" font-size="17" fill="#172b3a">label recognition</text><text x="687" y="205" font-size="17" fill="#172b3a">and extraction</text><text x="687" y="235" font-size="16" fill="#3e505b">text → Braille</text><rect x="855" y="105" width="210" height="155" rx="14" fill="#e5eeeb" stroke="#284f54" stroke-width="3"/><text x="960" y="150" font-size="20" font-weight="700" fill="#172b3a">Tactile map</text><text x="960" y="186" font-size="17" fill="#172b3a">tactile representation</text><text x="960" y="220" font-size="16" fill="#3e505b">Braille labels</text></g><path d="M248 182 H294" stroke="#284f54" stroke-width="4" marker-end="url(#arrow)"/><path d="M523 182 H569" stroke="#284f54" stroke-width="4" marker-end="url(#arrow)"/><path d="M798 182 H844" stroke="#284f54" stroke-width="4" marker-end="url(#arrow)"/><rect x="125" y="305" width="850" height="74" rx="14" fill="#f5eee8" stroke="#7b452c" stroke-width="2"/><text x="550" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172b3a">The software semi-automates preparation and supports</text><text x="550" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172b3a">tactile-graphics specialists.</text></svg>