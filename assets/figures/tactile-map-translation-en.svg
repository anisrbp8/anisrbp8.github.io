<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">Semi-automated translation of a geographic map into a tactile representation</title><desc id="desc">A map image goes through image processing, OCR and Braille translation with specialist support to produce a tactile map.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1100" height="430" fill="#ffffff"/><text x="550" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#000000">From a visual map to a tactile representation</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="105" width="210" height="155" fill="#ffffff" stroke="#000000" stroke-width="4"/><rect x="35" y="105" width="210" height="42" fill="#000000"/><text x="140" y="133" font-size="17" font-weight="700" fill="#ffffff">Geographic map</text><text x="140" y="183" font-size="18" font-weight="700" fill="#000000">Image file</text><text x="140" y="220" font-size="16" fill="#000000">visual source</text><rect x="305" y="105" width="215" height="155" fill="#ffffff" stroke="#000000" stroke-width="4"/><rect x="305" y="105" width="215" height="42" fill="#000000"/><text x="412" y="133" font-size="17" font-weight="700" fill="#ffffff">Image processing</text><text x="412" y="183" font-size="18" font-weight="700" fill="#000000">Image analysis</text><text x="412" y="220" font-size="16" fill="#000000">forms and elements</text><rect x="580" y="105" width="215" height="155" fill="#ffffff" stroke="#000000" stroke-width="4"/><rect x="580" y="105" width="215" height="42" fill="#000000"/><text x="687" y="133" font-size="18" font-weight="700" fill="#ffffff">OCR and translation</text><text x="687" y="181" font-size="17" font-weight="700" fill="#000000">Recognition</text><text x="687" y="207" font-size="17" fill="#000000">of map labels</text><text x="687" y="236" font-size="16" fill="#000000">text → Braille</text><rect x="855" y="105" width="210" height="155" fill="#ffffff" stroke="#000000" stroke-width="4"/><rect x="855" y="105" width="210" height="42" fill="#000000"/><text x="960" y="133" font-size="18" font-weight="700" fill="#ffffff">Tactile map</text><text x="960" y="183" font-size="18" font-weight="700" fill="#000000">Tactile version</text><text x="960" y="220" font-size="16" fill="#000000">Braille labels</text></g><path d="M248 182 H294" stroke="#000000" stroke-width="5" marker-end="url(#arrow)"/><path d="M523 182 H569" stroke="#000000" stroke-width="5" marker-end="url(#arrow)"/><path d="M798 182 H844" stroke="#000000" stroke-width="5" marker-end="url(#arrow)"/><rect x="125" y="305" width="850" height="74" fill="#000000"/><text x="550" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff">The software semi-automates preparation and supports</text><text x="550" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#ffffff">tactile-graphics specialists.</text></svg>