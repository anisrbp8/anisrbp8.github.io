<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">Multimodal assistive-interface concept combining augmented reality and BCI</title><desc id="desc">The user interacts with visual, audio and tactile augmented reality. EEG responses are interpreted by machine learning and used to adapt feedback.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#284f54"/></marker></defs><rect width="1100" height="460" rx="18" fill="#faf9f6"/><text x="550" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172b3a">Adaptive interaction concept for accessibility</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="155" width="180" height="110" rx="16" fill="#f5eee8" stroke="#7b452c" stroke-width="3"/><text x="125" y="202" font-size="21" font-weight="700" fill="#172b3a">User</text><text x="125" y="234" font-size="16" fill="#3e505b">perceives and responds</text><rect x="310" y="82" width="255" height="150" rx="16" fill="#eef2ef" stroke="#284f54" stroke-width="3"/><text x="437" y="119" font-size="20" font-weight="700" fill="#172b3a">Augmented reality</text><text x="437" y="147" font-size="18" fill="#172b3a">multimodal interface</text><rect x="333" y="168" width="66" height="36" rx="18" fill="#fff" stroke="#cbd1cc"/><text x="366" y="192" font-size="14" fill="#172b3a">visual</text><rect x="405" y="168" width="66" height="36" rx="18" fill="#fff" stroke="#cbd1cc"/><text x="438" y="192" font-size="14" fill="#172b3a">audio</text><rect x="477" y="168" width="66" height="36" rx="18" fill="#fff" stroke="#cbd1cc"/><text x="510" y="192" font-size="14" fill="#172b3a">tactile</text><rect x="310" y="310" width="180" height="90" rx="15" fill="#fff" stroke="#284f54" stroke-width="3"/><text x="400" y="347" font-size="19" font-weight="700" fill="#172b3a">BCI / EEG</text><text x="400" y="376" font-size="16" fill="#3e505b">measured response</text><rect x="555" y="310" width="205" height="90" rx="15" fill="#fff" stroke="#284f54" stroke-width="3"/><text x="657" y="346" font-size="18" font-weight="700" fill="#172b3a">Machine-learning</text><text x="657" y="373" font-size="18" font-weight="700" fill="#172b3a">interpretation</text><rect x="820" y="155" width="245" height="110" rx="16" fill="#e5eeeb" stroke="#284f54" stroke-width="3"/><text x="942" y="198" font-size="19" font-weight="700" fill="#172b3a">Immediate feedback</text><text x="942" y="228" font-size="17" fill="#172b3a">adapted to the user</text></g><path d="M217 182 C250 160 273 145 303 145" fill="none" stroke="#284f54" stroke-width="4" marker-end="url(#arrow)"/><path d="M303 189 C270 211 245 225 217 225" fill="none" stroke="#7b452c" stroke-width="3" marker-end="url(#arrow)"/><path d="M215 249 C245 285 270 338 303 350" fill="none" stroke="#284f54" stroke-width="4" marker-end="url(#arrow)"/><path d="M492 355 H548" fill="none" stroke="#284f54" stroke-width="4" marker-end="url(#arrow)"/><path d="M763 340 C820 315 850 285 875 270" fill="none" stroke="#284f54" stroke-width="4" marker-end="url(#arrow)"/><path d="M820 175 C735 105 665 100 572 125" fill="none" stroke="#7b452c" stroke-width="4" marker-end="url(#arrow)"/><text x="256" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#3e505b">interaction</text><text x="260" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#3e505b">neurophysiological response</text><text x="695" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#7b452c">feedback adjustment</text><text x="550" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#3e505b">Concept diagram based on the 2018 conference chapter.</text></svg>