<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">Multimodal assistive-interface concept combining augmented reality and BCI</title><desc id="desc">The user interacts with visual, audio and tactile augmented reality. EEG responses are interpreted by machine learning and used to adapt feedback.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1100" height="460" fill="#ffffff"/><text x="550" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#000000">Adaptive interaction concept for accessibility</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="155" width="180" height="110" fill="#ffffff" stroke="#000000" stroke-width="4"/><rect x="35" y="155" width="180" height="42" fill="#000000"/><text x="125" y="183" font-size="19" font-weight="700" fill="#ffffff">User</text><text x="125" y="228" font-size="16" fill="#000000">perceives and responds</text><rect x="310" y="82" width="255" height="150" fill="#ffffff" stroke="#000000" stroke-width="4"/><rect x="310" y="82" width="255" height="42" fill="#000000"/><text x="437" y="110" font-size="19" font-weight="700" fill="#ffffff">Augmented reality</text><text x="437" y="150" font-size="17" font-weight="700" fill="#000000">multimodal interface</text><rect x="333" y="171" width="66" height="36" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="366" y="195" font-size="14" font-weight="700" fill="#000000">visual</text><rect x="405" y="171" width="66" height="36" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="438" y="195" font-size="14" font-weight="700" fill="#000000">audio</text><rect x="477" y="171" width="66" height="36" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="510" y="195" font-size="14" font-weight="700" fill="#000000">tactile</text><rect x="310" y="310" width="180" height="90" fill="#ffffff" stroke="#000000" stroke-width="4"/><rect x="310" y="310" width="180" height="40" fill="#000000"/><text x="400" y="337" font-size="18" font-weight="700" fill="#ffffff">BCI / EEG</text><text x="400" y="380" font-size="16" fill="#000000">measured response</text><rect x="555" y="310" width="205" height="90" fill="#ffffff" stroke="#000000" stroke-width="4"/><rect x="555" y="310" width="205" height="40" fill="#000000"/><text x="657" y="337" font-size="17" font-weight="700" fill="#ffffff">Machine learning</text><text x="657" y="380" font-size="17" font-weight="700" fill="#000000">interpretation</text><rect x="820" y="155" width="245" height="110" fill="#ffffff" stroke="#000000" stroke-width="4"/><rect x="820" y="155" width="245" height="42" fill="#000000"/><text x="942" y="183" font-size="18" font-weight="700" fill="#ffffff">Immediate feedback</text><text x="942" y="228" font-size="17" font-weight="700" fill="#000000">adapted to the user</text></g><path d="M217 182 C250 160 273 145 303 145" fill="none" stroke="#000000" stroke-width="5" marker-end="url(#arrow)"/><path d="M303 189 C270 211 245 225 217 225" fill="none" stroke="#000000" stroke-width="5" marker-end="url(#arrow)"/><path d="M215 249 C245 285 270 338 303 350" fill="none" stroke="#000000" stroke-width="5" marker-end="url(#arrow)"/><path d="M492 355 H548" fill="none" stroke="#000000" stroke-width="5" marker-end="url(#arrow)"/><path d="M763 340 C820 315 850 285 875 270" fill="none" stroke="#000000" stroke-width="5" marker-end="url(#arrow)"/><path d="M820 175 C735 105 665 100 572 125" fill="none" stroke="#000000" stroke-width="5" marker-end="url(#arrow)"/><text x="256" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#000000">interaction</text><text x="260" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#000000">neurophysiological response</text><text x="695" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#000000">feedback adjustment</text><text x="550" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#000000">Concept diagram based on the 2018 conference chapter.</text></svg>