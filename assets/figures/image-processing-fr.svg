<title id="title">Adaptation granulaire des images</title><desc id="description">Une image couleur alimente la granulation variable et l’interpolation. La décomposition produit deux granules, utilisés pour interpoler les couleurs et sélectionner le premier plan. Le granule de premier plan et un facteur de réduction alimentent la construction du SVG tactile.</desc>
